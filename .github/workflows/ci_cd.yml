name: Deploy NeuroScan AI to AWS
on:
  push:
    branches: [ master ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull models from DagHub (DVC)
        run: |
          pip install dvc[http]
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USER }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}
          dvc pull

      - name: Build, tag & push Docker image to ECR
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }} .
          docker tag ${{ secrets.ECR_REPOSITORY }}:latest \
            512809230685.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
          docker push \
            512809230685.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Cleanup old Docker images & containers to free space
            docker system prune -af
            docker volume prune -f
            # Login to ECR
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              512809230685.dkr.ecr.us-east-1.amazonaws.com
            # Pull latest image
            docker pull 512809230685.dkr.ecr.us-east-1.amazonaws.com/neuroscanai:latest
            # Persist model stats before removing old container
            mkdir -p /home/ubuntu/artifacts
            docker cp neuroscan:/app/artifacts/model_stats.json /home/ubuntu/artifacts/model_stats.json || true
            # Stop & remove old container
            docker stop neuroscan || true
            docker rm neuroscan || true
            # Run new container
            docker run -d \
              --name neuroscan \
              --restart always \
              -p 8000:8000 \
              -v /home/ubuntu/artifacts/model_stats.json:/app/artifacts/model_stats.json \
              512809230685.dkr.ecr.us-east-1.amazonaws.com/neuroscanai:latest